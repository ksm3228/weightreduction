<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f8fc">
<title>체중 감량 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f7;
  --surface: #ffffff;
  --surface2: #f7f8fc;
  --surface3: #eef0f6;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.13);
  --text: #1a1f2e;
  --text2: #4a5568;
  --text3: #a0aab8;
  --accent: #0b9e7c;
  --accent2: #0078d4;
  --accent3: #e05a20;
  --gold: #c9920a;
  --danger: #d93025;
  --success: #0b9e7c;
  --warn: #d97706;
  --radius: 12px;
  --radius-lg: 18px;
  --mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  min-height: 100dvh;
  overscroll-behavior: none;
}

/* 배경 패턴 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ── 앱바 ── */
.app-bar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: env(safe-area-inset-top) 0 0;
}
.app-bar-inner {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 14px 16px; gap: 10px;
}
.app-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 700; color: var(--text);
  letter-spacing: -0.3px;
}
.app-title .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.sync-dot { width:8px;height:8px;border-radius:50%;background:#333;display:inline-block;margin-left:6px;vertical-align:middle;transition:background .3s }
.sync-dot.connected { background:var(--accent);box-shadow:0 0 6px var(--accent) }
.sync-dot.syncing { background:var(--warn) }

.app-bar-actions { display:flex; align-items:center; gap:8px }
.btn-icon {
  padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--surface2); color: var(--text2);
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: all .15s; font-family: 'Noto Sans KR', sans-serif;
}
.btn-icon:hover { background: var(--surface3); color: var(--text) }
.btn-icon:active { opacity: .7 }
.btn-icon.primary {
  background: var(--accent); color: #000; border-color: var(--accent);
  font-weight: 700;
}

/* ── 통계 바 ── */
.stats-row {
  display: grid; grid-template-columns: repeat(4,1fr);
  gap: 8px; padding: 12px 16px;
  background: rgba(240,242,247,0.8);
  border-bottom: 1px solid var(--border);
}
.stat-card {
  background: var(--surface2); border-radius: var(--radius);
  padding: 10px 8px; text-align: center;
  border: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.stat-card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
}
.stat-card:nth-child(1)::before { background: var(--accent) }
.stat-card:nth-child(2)::before { background: var(--accent2) }
.stat-card:nth-child(3)::before { background: var(--gold) }
.stat-card:nth-child(4)::before { background: var(--accent3) }
.stat-num {
  font-family: var(--mono); font-size: 22px; font-weight: 500;
  line-height: 1; color: var(--text);
}
.stat-lbl { font-size: 10px; color: var(--text2); margin-top: 4px; letter-spacing: .3px }

/* ── 환자 목록 ── */
.patient-list { padding: 16px 16px 120px; position: relative; z-index: 1 }

.patient-block {
  background: var(--surface);
  border: 2px solid var(--text);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color .2s;
  animation: fadeUp .3s ease forwards;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.patient-block:hover { border-color: var(--text) }

/* 환자 헤더 */
.patient-header {
  display: flex; align-items: center;
  padding: 10px 12px; gap: 6px;
  cursor: pointer; user-select: none;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  flex-wrap: nowrap;
}

  .patient-header-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-sm {
  padding: 4px 7px; border-radius: 6px;
  border: 1px solid var(--border2);
  background: transparent; color: var(--text2);
  font-size: 10px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: all .15s;
}
  
  .patient-header:active { background: var(--surface3) }
.reg-badge {
  font-family: var(--mono); font-size: 11px;
  color: var(--text2); background: var(--surface3);
  border: 1px solid var(--border2); border-radius: 6px;
  padding: 3px 7px; flex-shrink: 0;
  font-weight: 600;
}
  
.patient-name {
  font-size: 14px; font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 3em;
  flex: 1;
}


  
.height-badge {
  font-family: var(--mono); font-size: 12px;
  color: var(--accent); background: rgba(0,212,170,0.1);
  border: 1px solid rgba(0,212,170,0.2); border-radius: 6px;
  padding: 3px 8px; flex-shrink: 0;
}
.chevron {
  font-size: 14px; color: var(--text3);
  transition: transform .2s; flex-shrink: 0;
}
.chevron.open { transform: rotate(180deg) }
.patient-header-actions {
  display: flex; gap: 6px; flex-shrink: 0;
}
  
.btn-sm {
  padding: 4px 7px; border-radius: 6px;
  border: 1px solid var(--border2);
  background: transparent; color: var(--text2);
  font-size: 10px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: all .15s;
}
  
.btn-sm:hover { background: var(--surface3); color: var(--text) }
.btn-sm.danger { border-color: var(--danger); color: var(--danger) }
.btn-sm.danger:hover { background: rgba(255,71,87,0.1) }

/* 약물 그룹 */
.drug-section {
  display: none; padding: 12px;
}
.drug-section.open { display: block }
.drug-group {
  background: var(--surface2); border-radius: var(--radius);
  border: 1px solid var(--border2);
  margin-bottom: 10px; overflow: hidden;
}
.drug-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.drug-name {
  font-size: 13px; font-weight: 600;
  color: var(--gold);
  display: flex; align-items: center; gap: 6px;
}
.drug-name::before {
  content: '💊'; font-size: 12px;
}

/* 측정 테이블 */
.measure-table {
  width: 100%; border-collapse: collapse;
}
.measure-table thead tr {
  background: var(--surface3);
}
.measure-table th {
  font-family: var(--mono); font-size: 10px;
  color: var(--text3); text-align: center;
  padding: 7px 4px; font-weight: 500;
  letter-spacing: .5px; text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.measure-table td {
  font-family: var(--mono); font-size: 12px;
  color: var(--text); text-align: center;
  padding: 9px 4px; border-bottom: 1px solid var(--border2);
}
.measure-table tr:last-child td { border-bottom: none }
.measure-table tr:hover td { background: rgba(255,255,255,0.02) }
.measure-table td.date-col {
  font-size: 11px; color: var(--text3);
}
.measure-table td.loss-col {
  font-weight: 600;
}
.loss-good { color: var(--success) }
.loss-warn { color: var(--warn) }
.loss-none { color: var(--text3) }
.bmi-chip {
  display: inline-block; padding: 2px 6px; border-radius: 4px;
  font-size: 11px; font-weight: 600;
}
.bmi-obese { background: rgba(255,71,87,0.15); color: var(--danger) }
.bmi-over { background: rgba(255,165,2,0.15); color: var(--warn) }
.bmi-normal { background: rgba(0,212,170,0.15); color: var(--success) }

/* 빈 측정 행 */
.empty-row td { color: var(--text3); opacity: .4 }
.empty-row td::before { content: '—' }

/* 최신 요약 뱃지 */
.latest-summary {
  display: flex; gap: 6px; padding: 8px 14px;
  background: rgba(0,212,170,0.04);
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.summary-chip {
  font-size: 12px; font-family: var(--mono);
  padding: 3px 10px; border-radius: 6px;
  border: 1.5px solid rgba(11,158,124,0.4);
  background: rgba(11,158,124,0.12);
  color: #087a60;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.summary-chip.warn {
  border-color: rgba(255,165,2,0.2);
  background: rgba(255,165,2,0.08);
  color: var(--warn);
}

/* FAB */
.fab {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom));
  right: 20px; width: 56px; height: 56px;
  border-radius: 50%; background: var(--accent);
  color: #000; border: none; font-size: 28px; font-weight: 300;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,212,170,.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 20; transition: transform .15s;
}
.fab:active { transform: scale(.92) }

/* ── 시트 (bottom sheet) ── */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  backdrop-filter: blur(4px);
  z-index: 50; display: none; align-items: flex-end;
}
.sheet-backdrop.open { display: flex }
.sheet {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px 20px 0 0;
  width: 100%; max-height: 92dvh; overflow-y: auto;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
  animation: slideUp .22s cubic-bezier(.32,.72,0,1);
  -webkit-overflow-scrolling: touch;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--border2); border-radius: 2px;
  margin: 12px auto 0;
}
.sheet-title {
  padding: 12px 18px 14px; font-size: 15px; font-weight: 700;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
.sheet-body { padding: 16px 18px 0 }
.form-group { margin-bottom: 14px }
.form-group label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--text2); margin-bottom: 6px; letter-spacing: .3px;
  text-transform: uppercase;
}
.form-group input, .form-group select {
  width: 100%; padding: 11px 13px;
  border-radius: var(--radius); border: 1px solid var(--border2);
  background: var(--surface2); color: var(--text);
  font-size: 15px; font-family: 'Noto Sans KR', sans-serif;
  outline: none; -webkit-appearance: none; appearance: none;
  transition: border-color .2s, box-shadow .2s;
}
.form-group input:focus, .form-group select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,212,170,.15);
}
.form-row { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px }
.form-row-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px }
.sheet-divider {
  font-size: 11px; font-weight: 700; color: var(--accent);
  letter-spacing: 1px; text-transform: uppercase;
  padding: 8px 0 10px; border-top: 1px solid var(--border);
  margin-top: 4px;
}
.sheet-btns {
  display: flex; gap: 10px; padding: 14px 18px 0;
  border-top: 1px solid var(--border); margin-top: 16px;
}
.btn-cancel {
  flex: 1; padding: 12px; border-radius: var(--radius);
  border: 1px solid var(--border2); background: var(--surface2);
  color: var(--text2); font-size: 15px; font-weight: 500; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
}
.btn-save {
  flex: 2; padding: 12px; border-radius: var(--radius);
  border: none; background: var(--accent); color: #000;
  font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: opacity .15s;
}
.btn-cancel:active, .btn-save:active { opacity: .7 }

/* 측정 추가 시트용 */
.drug-select-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
}
.drug-select-btn {
  flex: 1; min-width: 100px; padding: 10px;
  border-radius: var(--radius); border: 1px solid var(--border2);
  background: var(--surface2); color: var(--text2);
  font-size: 13px; cursor: pointer; text-align: center;
  font-family: 'Noto Sans KR', sans-serif; transition: all .15s;
}
.drug-select-btn.selected {
  border-color: var(--accent); background: rgba(0,212,170,.1);
  color: var(--accent); font-weight: 600;
}

/* 확인 모달 */
.confirm-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  backdrop-filter: blur(4px);
  z-index: 60; display: none;
  align-items: center; justify-content: center; padding: 24px;
}
.confirm-backdrop.open { display: flex }
.confirm-box {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); padding: 22px 20px 18px;
  width: 100%; max-width: 320px;
}
.confirm-title { font-size: 15px; font-weight: 700; margin-bottom: 8px }
.confirm-msg { font-size: 13px; color: var(--text2); margin-bottom: 18px; line-height: 1.6 }
.confirm-btns { display: flex; gap: 8px }
.btn-cc {
  flex: 1; padding: 10px; border-radius: var(--radius);
  border: 1px solid var(--border2); background: var(--surface2);
  color: var(--text); font-size: 14px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
}
.btn-cd {
  flex: 1; padding: 10px; border-radius: var(--radius);
  border: none; background: var(--danger); color: #fff;
  font-size: 14px; font-weight: 700; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
}

/* 토스트 */
.toast {
  position: fixed;
  bottom: calc(90px + env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%) translateY(16px);
  background: #1a1f2e; color: #fff;
  border: 1px solid rgba(0,0,0,0.15);
  padding: 10px 20px; border-radius: 24px;
  font-size: 13px; font-weight: 500; white-space: nowrap;
  opacity: 0; transition: all .25s; z-index: 80; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0) }

/* 로그인 */
.login-screen {
  display: none; position: fixed; inset: 0;
  background: var(--bg); z-index: 200;
  flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
.login-logo {
  font-size: 48px; margin-bottom: 8px;
}
.login-title { font-size: 22px; font-weight: 700; color: var(--text) }
.login-sub { font-size: 13px; color: var(--text2) }
.btn-google {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 28px; border-radius: var(--radius);
  border: 1px solid var(--border2); background: var(--surface);
  color: var(--text); font-size: 15px; font-weight: 500; cursor: pointer;
  transition: all .15s; font-family: 'Noto Sans KR', sans-serif;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.btn-google:hover { background: var(--surface2); border-color: var(--accent) }

/* 로딩 */
.loading-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 100;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
}
.loading-spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg)} }
.loading-text { font-size: 13px; color: var(--text2) }

/* 빈 상태 */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text3);
}
.empty-icon { font-size: 48px; margin-bottom: 12px }
.empty-text { font-size: 14px; line-height: 1.7 }

/* undo/redo */
.history-btns { display: flex; gap: 4px }
.btn-hist {
  padding: 5px 10px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--surface2);
  color: var(--text2); font-size: 14px; cursor: pointer;
  transition: all .15s;
}
.btn-hist:disabled { opacity: .2; cursor: default }
.btn-hist:not(:disabled):hover { background: var(--surface3); color: var(--text) }

/* 검색창 */
.search-bar {
  padding: 8px 16px 10px;
  background: rgba(240,242,247,0.8);
  border-bottom: 1px solid var(--border);
}
.search-input {
  width: 100%; padding: 9px 14px;
  border-radius: var(--radius); border: 1px solid var(--border2);
  background: var(--surface2); color: var(--text);
  font-size: 14px; font-family: 'Noto Sans KR', sans-serif; outline: none;
}
.search-input:focus { border-color: var(--accent) }

.chip-good { background: rgba(11,158,124,0.15); border-color: rgba(11,158,124,0.5); color: #087a60; }
.chip-warn { background: rgba(217,119,6,0.15); border-color: rgba(217,119,6,0.5); color: #b45309; }
.chip-low  { background: rgba(107,114,128,0.12); border-color: rgba(107,114,128,0.4); color: #4b5563; }  
  
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen" class="login-screen">
  <div class="login-logo">⚖️</div>
  <div class="login-title">체중 감량 관리</div>
  <div class="login-sub">허용된 계정으로만 접속 가능합니다</div>
  <button class="btn-google" onclick="googleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20">
    Google로 로그인
  </button>
</div>

<!-- 로딩 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">데이터 불러오는 중...</div>
</div>

<!-- 앱 본문 -->
<div id="appContent" style="display:none">

  <div class="app-bar">
    <div class="app-bar-inner">
      <span class="app-title">
        <span class="dot"></span>
        체중 감량 관리
        <span style="font-size:11px;font-weight:400;color:var(--text3)">(v6.3)</span>
        <span class="sync-dot" id="syncDot"></span>
      </span>
      <div class="app-bar-actions">
        <div class="history-btns">
          <button class="btn-hist" id="btnUndo" onclick="undo()" disabled title="되돌리기">↩</button>
          <button class="btn-hist" id="btnRedo" onclick="redo()" disabled title="앞으로">↪</button>
        </div>
        <span id="dateDisplay" style="font-size:11px;color:var(--text3)"></span>
        <button class="btn-icon" onclick="googleLogout()">로그아웃</button>
      </div>
    </div>
  </div>

  <!-- 통계 -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-lbl">전체 환자</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statAvgLoss" style="color:var(--accent)">0%</div>
      <div class="stat-lbl">평균 감량률</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statBest" style="color:var(--gold)">0%</div>
      <div class="stat-lbl">최고 감량률</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statRecords" style="color:var(--accent3)">0</div>
      <div class="stat-lbl">총 측정 건수</div>
    </div>
  </div>

  <!-- 검색 -->
  <div class="search-bar" style="display:flex;gap:8px;align-items:center">
  <input class="search-input" id="searchInput" placeholder="🔍  이름 / 등록번호 검색..." oninput="render()" style="flex:1">
  <button id="btnEdit" onclick="toggleEditMode()" style="padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;flex-shrink:0">편집</button>
</div>

  <!-- 환자 목록 -->

<!-- ════════════════════ SCRIPT ════════════════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* ── Firebase 설정 ─────────────────────────────────────────────────── */
/* ⚠️  아래 firebaseConfig를 본인 프로젝트 값으로 교체하세요             */
const firebaseConfig = {
  apiKey: "AIzaSyC9k6iGUcNObjxQGtlVOuP5_YSpErT9DtA",
  authDomain: "ward-app-257c4.firebaseapp.com",
  databaseURL: "https://ward-app-257c4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ward-app-257c4",
  storageBucket: "ward-app-257c4.firebasestorage.app",
  messagingSenderId: "261869081149",
  appId: "1:261869081149:web:4577686dd03d9853861054"
};
const ALLOWED_EMAILS = [
  'kimsungmin83@gmail.com'   /* ⚠️ 허용할 Google 계정 이메일로 교체하세요 */
];
/* ─────────────────────────────────────────────────────────────────── */

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const dbRef = ref(db, 'weight_patients');
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* ── 상태 ── */
let all = [];          // 환자 배열
let openIds = new Set(); // 펼쳐진 카드 ID
let nid = Date.now();
let histStack = [], histIdx = -1;
let confirmCb = null;
let measurePatientId = null; // 측정 추가 대상 환자 ID
let selectedDrug = '';

/* ── 로그인 ── */
function showLogin() {
  document.getElementById('loadingOverlay').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appContent').style.display = 'none';
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
}

window.googleLogin = async () => {
  try {
    await signInWithRedirect(auth, provider);
  } catch(e) { alert('로그인 실패: ' + e.message); }
};
getRedirectResult(auth).catch(e => console.error(e));
window.googleLogout = () => signOut(auth);

onAuthStateChanged(auth, user => {
  document.getElementById('loadingOverlay').style.display = 'none';
  if (user && ALLOWED_EMAILS.includes(user.email)) {
    showApp();
    onValue(dbRef, snap => {
      const data = snap.val();
      if (data && Array.isArray(data)) {
        all = data;
        // 새 환자가 Firebase에 없으면 병합
        let changed = false;
        SAMPLE_DATA.forEach(sp => {
          if (!all.find(p => p.regNo === sp.regNo)) {
            all.push(sp);
            changed = true;
          }
        });
        if (changed) persist();
      } else if (!data) {
        all = SAMPLE_DATA;
        persist();
      }
      setSyncDot('connected');
      if (histStack.length === 0) pushHistory();
      render();
    }, () => { setSyncDot(''); toast('Firebase 연결 실패'); });
  } else {
    showLogin();
  }
});

/* ── sync dot ── */
function setSyncDot(s) {
  const d = document.getElementById('syncDot');
  d.className = 'sync-dot' + (s==='connected'?' connected':s==='syncing'?' syncing':'');
}

/* ── persist ── */
async function persist() {
  setSyncDot('syncing');
  try { await set(dbRef, all); setSyncDot('connected'); }
  catch(e) { setSyncDot(''); toast('저장 실패'); }
}

/* ── history ── */
function pushHistory() {
  histStack = histStack.slice(0, histIdx + 1);
  histStack.push(JSON.stringify(all));
  histIdx++;
  updateHistBtns();
}
function updateHistBtns() {
  document.getElementById('btnUndo').disabled = histIdx <= 0;
  document.getElementById('btnRedo').disabled = histIdx >= histStack.length - 1;
}
window.undo = () => {
  if (histIdx <= 0) return;
  histIdx--;
  all = JSON.parse(histStack[histIdx]);
  persist(); render(); updateHistBtns(); toast('되돌렸습니다');
};
window.redo = () => {
  if (histIdx >= histStack.length - 1) return;
  histIdx++;
  all = JSON.parse(histStack[histIdx]);
  persist(); render(); updateHistBtns(); toast('앞으로 이동했습니다');
};

/* ── 유틸 ── */
window.toast = msg => {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
};
function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) { return d ? d.slice(2).replace(/-/g,'/') : ''; }
function calcBMI(weight, heightCm) {
  if (!weight || !heightCm) return null;
  const h = heightCm / 100;
  return (weight / (h * h)).toFixed(1);
}
function bmiClass(bmi) {
  if (!bmi) return '';
  const v = parseFloat(bmi);
  if (v >= 30) return 'bmi-obese';
  if (v >= 25) return 'bmi-over';
  return 'bmi-normal';
}
function lossRate(init, cur) {
  if (!init || !cur || init <= 0) return null;
  return (((init - cur) / init) * 100).toFixed(1);
}
function lossClass(rate) {
  if (rate === null) return 'loss-none';
  const v = parseFloat(rate);
  if (v >= 10) return 'loss-good';
  if (v >= 5) return 'loss-warn';
  return 'loss-none';
}

/* ── 렌더 ── */
function render() {
  const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  const list = all.filter(p =>
    !query ||
    p.name.toLowerCase().includes(query) ||
    (p.regNo || '').toLowerCase().includes(query)
  ).sort((a, b) => {
    const aLast = (a.measurements||[]).sort((x,y) => (y.date||'').localeCompare(x.date||''))[0]?.date || '';
    const bLast = (b.measurements||[]).sort((x,y) => (y.date||'').localeCompare(x.date||''))[0]?.date || '';
    return bLast.localeCompare(aLast);
  });

  // 통계
  const active = all;
  let totalLoss = 0, bestLoss = 0, totalRecords = 0;
  active.forEach(p => {
    (p.measurements || []).forEach(m => {
      totalRecords++;
      const r = lossRate(m.initWeight, m.curWeight);
      if (r !== null) {
        const v = parseFloat(r);
        totalLoss += v;
        if (v > bestLoss) bestLoss = v;
      }
    });
  });
  document.getElementById('statTotal').textContent = active.length;
  document.getElementById('statAvgLoss').textContent =
    totalRecords > 0 ? (totalLoss / totalRecords).toFixed(1) + '%' : '0%';
  document.getElementById('statBest').textContent = bestLoss.toFixed(1) + '%';
  document.getElementById('statRecords').textContent = totalRecords;

  const el = document.getElementById('patientList');
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">⚖️</div><div class="empty-text">등록된 환자가 없습니다<br>아래 + 버튼으로 추가하세요</div></div>';
    return;
  }

  el.innerHTML = list.map((p, idx) => {
    const isOpen = openIds.has(p.id);
    const measures = p.measurements || [];

    // 약물별 그룹화
    const byDrug = {};
    measures.forEach(m => {
      if (!byDrug[m.drug]) byDrug[m.drug] = [];
      byDrug[m.drug].push(m);
    });
    // 각 약물 내 날짜 정렬
    Object.values(byDrug).forEach(arr => arr.sort((a,b) => (a.date||'').localeCompare(b.date||'')));

    // 최신 측정 요약
    const lastMeasure = [...measures].sort((a,b) => (b.date||'').localeCompare(a.date||''))[0];
const firstMeasure = [...measures].sort((a,b) => (a.date||'').localeCompare(b.date||''))[0];
const initWeight = firstMeasure?.initWeight;
const lastWeight = lastMeasure?.curWeight;
const latestLoss = initWeight && lastWeight ? lossRate(initWeight, lastWeight) : null;
    const latestBMI = lastMeasure ? calcBMI(lastMeasure.curWeight, p.height) : null;

    const drugSections = Object.entries(byDrug)
      .sort((a, b) => {
        const aFirst = a[1].reduce((min, m) => m.date < min ? m.date : min, a[1][0]?.date || '');
        const bFirst = b[1].reduce((min, m) => m.date < min ? m.date : min, b[1][0]?.date || '');
        return aFirst.localeCompare(bFirst);
      })
      .map(([drug, mArr]) => `
      <div class="drug-group">
        <div class="drug-header">
          <span class="drug-name">${drug}</span>
          <button class="btn-sm" onclick="openMeasureSheet(${p.id},'${drug}')">+ 측정 추가</button>
        </div>
        <table class="measure-table">
          <thead>
            <tr>
              <th>날짜</th>
              <th>초기(kg)</th>
              <th>현재(kg)</th>
              <th>감량률</th>
              <th>BMI</th>
              <th>용량</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${mArr.map(m => {
              const r = lossRate(m.initWeight, m.curWeight);
              const bmi = calcBMI(m.curWeight, p.height);
              return `
              <tr>
                <td class="date-col">${fmtDate(m.date)||'—'}</td>
                <td>${m.initWeight ? m.initWeight+'kg' : '—'}</td>
                <td style="font-weight:600">${m.curWeight ? m.curWeight+'kg' : '—'}</td>
                <td class="loss-col">
                  ${r !== null ? `<span style="
                    display:inline-block;padding:3px 10px;border-radius:8px;font-weight:700;font-size:13px;
                    ${parseFloat(r)>=10 ? 'background:rgba(11,158,124,0.15);color:#087a60;border:1.5px solid rgba(11,158,124,0.4)' :
                      parseFloat(r)>=5  ? 'background:rgba(217,119,6,0.15);color:#b45309;border:1.5px solid rgba(217,119,6,0.4)' :
                      parseFloat(r)>0   ? 'background:rgba(217,48,37,0.1);color:#d93025;border:1.5px solid rgba(217,48,37,0.3)' :
                                          'background:rgba(107,114,128,0.1);color:#4b5563;border:1.5px solid rgba(107,114,128,0.3)'}
                  ">${r}%</span>` : '—'}
                </td>
                <td><span class="bmi-chip ${bmiClass(bmi)}">${bmi||'—'}</span></td>
                <td style="color:var(--accent2);font-weight:600">${m.dose||'—'}</td>
                <td>
                  <button class="btn-sm" onclick="editMeasure(${p.id},'${m.id}')">수정</button>
                  <button class="btn-sm danger" onclick="askDelMeasure(${p.id},'${m.id}')">삭제</button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `).join('');

    // 마지막 측정일 기준 2개월 초과 여부
    const isOverdue = (() => {
      if (!lastMeasure?.date) return false;
      const last = new Date(lastMeasure.date);
      const now = new Date();
      const diffDays = (now - last) / (1000 * 60 * 60 * 24);
      return diffDays > 60;
    })();

    return `
    <div class="patient-block" id="pb-${p.id}" style="${isOverdue ? 'background:#fff3f3;border-color:rgba(217,48,37,0.25);border-width:2px' : ''}">
      <div class="patient-header" onclick="togglePatient(${p.id})" style="flex-direction:column;align-items:stretch;gap:6px;${isOverdue ? 'background:#ffe8e8' : ''}">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-family:var(--mono);font-size:12px;color:var(--text3);flex-shrink:0;min-width:1.5em;text-align:center">${idx+1}</span>
          <span class="reg-badge">${p.regNo || '—'}</span>
          <span style="font-size:15px;font-weight:700;flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</span>
          ${p.gender ? `<span style="font-size:11px;color:var(--text3);flex-shrink:0">(${p.gender})</span>` : ''}
          ${p.age ? `<span style="font-size:11px;color:var(--text3);flex-shrink:0">${p.age}세</span>` : ''}
          ${lastMeasure?.date ? `<span style="font-size:11px;color:var(--text3);font-family:var(--mono);flex-shrink:0">(${Math.floor((new Date()-new Date(lastMeasure.date))/(1000*60*60*24))}일전)</span>` : ''}
          <div class="patient-header-actions" onclick="event.stopPropagation()" style="flex-shrink:0">
            ${editMode
              ? `<button class="btn-sm danger" onclick="askDelPatient(${p.id})">삭제</button>`
              : `<button class="btn-sm" onclick="openPatientSheet(${p.id})">수정</button>`}
          </div>
          <span class="chevron ${isOpen ? 'open' : ''}" id="chev-${p.id}">⌄</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;padding-left:calc(1.5em + 6px)">
          ${(() => {
            const latestBMI = lastMeasure ? calcBMI(lastMeasure.curWeight, p.height) : null;
            if (!latestBMI) return '';
            const bv = parseFloat(latestBMI);
            const bStyle = bv >= 30
              ? 'border-color:rgba(217,48,37,0.4);background:rgba(217,48,37,0.1);color:#d93025'
              : 'border-color:rgba(0,120,212,0.3);background:rgba(0,120,212,0.08);color:#0078d4';
            return `<span class="summary-chip" style="${bStyle}">BMI ${latestBMI}</span>`;
          })()}
          ${latestLoss !== null ? `<span class="summary-chip ${parseFloat(latestLoss)>=10?'chip-good':parseFloat(latestLoss)>=5?'chip-warn':'chip-low'}">${latestLoss}%↓</span>` : ''}
        </div>
      </div>
      ${p.memo ? `<div style="padding:6px 16px 8px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border)">${p.memo}</div>` : ''}
      <div class="drug-section ${isOpen ? 'open' : ''}" id="ds-${p.id}">
        ${drugSections || '<div style="padding:16px;text-align:center;color:var(--text3);font-size:13px">측정 기록이 없습니다<br><br><button class="btn-sm" style="border-color:var(--accent);color:var(--accent)" onclick="openMeasureSheet('+p.id+',null)">+ 첫 측정 추가</button></div>'}
      </div>
    </div>`;
  }).join('');
}

window.togglePatient = id => {
  if (openIds.has(id)) openIds.delete(id);
  else openIds.add(id);
  const ds = document.getElementById('ds-'+id);
  const chev = document.getElementById('chev-'+id);
  if (ds) ds.classList.toggle('open', openIds.has(id));
  if (chev) chev.classList.toggle('open', openIds.has(id));
};

/* ── 환자 시트 ── */
window.openPatientSheet = id => {
  document.getElementById('patientSheetTitle').textContent = id ? '환자 수정' : '환자 등록';
  document.getElementById('ps_id').value = id || '';
  if (id) {
    const p = all.find(x => x.id === id);
    document.getElementById('ps_regNo').value = p.regNo || '';
    document.getElementById('ps_name').value = p.name || '';
    document.getElementById('ps_age').value = p.age || '';
    document.getElementById('ps_height').value = p.height || '';
    document.getElementById('ps_gender').value = p.gender || '';
    document.getElementById('ps_memo').value = p.memo || '';
  } else {
    ['ps_regNo','ps_name','ps_age','ps_height','ps_memo'].forEach(f => document.getElementById(f).value = '');
    document.getElementById('ps_gender').value = '';
  }
  document.getElementById('patientSheet').classList.add('open');
};
window.savePatient = () => {
  const regNo = document.getElementById('ps_regNo').value.trim();
  const name  = document.getElementById('ps_name').value.trim();
  if (!name) { alert('성명을 입력하세요.'); return; }
  pushHistory();
  const fid = document.getElementById('ps_id').value;
  const data = {
    regNo, name,
    age: parseInt(document.getElementById('ps_age').value) || null,
    height: parseFloat(document.getElementById('ps_height').value) || null,
    gender: document.getElementById('ps_gender').value,
    memo: document.getElementById('ps_memo').value.trim(),
  };
  if (fid) {
    const idx = all.findIndex(x => x.id == fid);
    if (idx >= 0) all[idx] = { ...all[idx], ...data };
    toast('수정되었습니다');
  } else {
    all.push({ id: nid++, measurements: [], ...data });
    toast('등록되었습니다');
  }
  persist(); closeSheet('patientSheet'); render();
};

/* ── 측정 시트 ── */
window.openMeasureSheet = (patientId, drug) => {
  measurePatientId = patientId;
  selectedDrug = drug || '';
  document.getElementById('ms_patientId').value = patientId;
  document.getElementById('ms_measureId').value = '';
  document.getElementById('ms_date').value = today();
  document.getElementById('ms_drug').value = drug || '';
  document.getElementById('ms_initWeight').value = '';
  document.getElementById('ms_curWeight').value = '';
  document.getElementById('ms_lossRate').value = '';
  document.getElementById('ms_bmi').value = '';
  document.getElementById('ms_dose').value = '';
  document.getElementById('ms_memo').value = '';
  // 약물 버튼 초기화
  ['큐시미아','마운자로','위고비','삭센다'].forEach(d => {
    document.getElementById('drug-'+d).classList.toggle('selected', d === drug);
  });
  const p = all.find(x => x.id === patientId);
  document.getElementById('measureSheetTitle').textContent =
    (p ? p.name + ' — ' : '') + '측정 기록 추가';
  // 초기체중 자동 채우기 (같은 약물의 가장 최근 초기체중)
  if (drug && p) {
    const same = (p.measurements||[]).filter(m => m.drug === drug).sort((a,b) => (b.date||'').localeCompare(a.date||''));
    if (same.length) document.getElementById('ms_initWeight').value = same[0].initWeight || '';
  }
  document.getElementById('measureSheet').classList.add('open');
  setupMeasureCalc();
};

window.editMeasure = (patientId, measureId) => {
  const p = all.find(x => x.id === patientId);
  if (!p) return;
  const m = (p.measurements||[]).find(x => x.id === measureId);
  if (!m) return;
  measurePatientId = patientId;
  selectedDrug = m.drug || '';
  document.getElementById('ms_patientId').value = patientId;
  document.getElementById('ms_measureId').value = measureId;
  document.getElementById('ms_date').value = m.date || today();
  document.getElementById('ms_drug').value = m.drug || '';
  document.getElementById('ms_initWeight').value = m.initWeight || '';
  document.getElementById('ms_curWeight').value = m.curWeight || '';
  document.getElementById('ms_dose').value = m.dose || '';
  document.getElementById('ms_memo').value = m.memo || '';
  ['큐시미아','마운자로','위고비','삭센다'].forEach(d => {
    document.getElementById('drug-'+d).classList.toggle('selected', d === m.drug);
  });
  document.getElementById('measureSheetTitle').textContent = '측정 기록 수정';
  document.getElementById('measureSheet').classList.add('open');
  setupMeasureCalc();
  updateCalc();
};

const DOSE_OPTIONS = {
  '마운자로': ['2.5mg','5mg','7.5mg','10mg'],
  '큐시미아': ['3.75/23mg','7.5/46mg','11.25/69mg','15/92mg'],
  'Xenical':  ['120mg'],
};

window.selectDrug = drug => {
  selectedDrug = drug;
  document.getElementById('ms_drug').value = drug;
  ['큐시미아','마운자로','위고비','삭센다'].forEach(d => {
    document.getElementById('drug-'+d).classList.toggle('selected', d === drug);
  });

  // 용량 버튼 렌더
  const doses = DOSE_OPTIONS[drug] || [];
  const doseGroup = document.getElementById('doseGroup');
  const doseBtns = document.getElementById('doseBtns');
  if (doses.length) {
    doseGroup.style.display = 'block';
    doseBtns.innerHTML = doses.map(d => `
      <button type="button" onclick="selectDose('${d}')"
        id="dose-btn-${d.replace('/','_')}"
        style="padding:6px 12px;border-radius:8px;border:1px solid var(--border2);
               background:var(--surface2);color:var(--text2);font-size:12px;
               cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s">
        ${d}
      </button>`).join('');
    // 직전 같은 약물 용량 자동 선택
    const patientId = parseInt(document.getElementById('ms_patientId').value);
    const p = all.find(x => x.id === patientId);
    if (p) {
      const same = (p.measurements||[]).filter(m => m.drug === drug).sort((a,b) => (b.date||'').localeCompare(a.date||''));
      if (same.length && same[0].dose) selectDose(same[0].dose);
    }
  } else {
    doseGroup.style.display = doses.length === 0 && drug ? 'block' : 'none';
    doseBtns.innerHTML = '';
  }

  // 초기체중 자동 채우기
  const patientId = parseInt(document.getElementById('ms_patientId').value);
  const p = all.find(x => x.id === patientId);
  if (p) {
    const same = (p.measurements||[]).filter(m => m.drug === drug).sort((a,b) => (b.date||'').localeCompare(a.date||''));
    if (same.length && !document.getElementById('ms_initWeight').value) {
      document.getElementById('ms_initWeight').value = same[0].initWeight || '';
      updateCalc();
    }
  }
};

window.selectDose = dose => {
  document.getElementById('ms_dose').value = dose;
  document.querySelectorAll('#doseBtns button').forEach(btn => {
    const isSelected = btn.textContent.trim() === dose;
    btn.style.background = isSelected ? 'rgba(0,120,212,0.1)' : 'var(--surface2)';
    btn.style.borderColor = isSelected ? '#0078d4' : 'var(--border2)';
    btn.style.color = isSelected ? '#0078d4' : 'var(--text2)';
    btn.style.fontWeight = isSelected ? '700' : '400';
  });
};

function setupMeasureCalc() {
  ['ms_initWeight','ms_curWeight'].forEach(id => {
    const el = document.getElementById(id);
    el.oninput = updateCalc;
  });
}
function updateCalc() {
  const init = parseFloat(document.getElementById('ms_initWeight').value);
  const cur  = parseFloat(document.getElementById('ms_curWeight').value);
  const patientId = parseInt(document.getElementById('ms_patientId').value);
  const p = all.find(x => x.id === patientId);
  const r = lossRate(init, cur);
  document.getElementById('ms_lossRate').value = r !== null ? r + '%' : '';
  const bmi = p?.height ? calcBMI(cur, p.height) : null;
  document.getElementById('ms_bmi').value = bmi || '';
}

window.saveMeasure = () => {
  const patientId = parseInt(document.getElementById('ms_patientId').value);
  const measureId = document.getElementById('ms_measureId').value;
  const drug = document.getElementById('ms_drug').value || selectedDrug;
  if (!drug) { alert('약물을 선택하세요.'); return; }
  const curWeight = parseFloat(document.getElementById('ms_curWeight').value);
  if (!curWeight) { alert('현재체중을 입력하세요.'); return; }
  pushHistory();
  const idx = all.findIndex(x => x.id === patientId);
  if (idx < 0) return;
  const mData = {
    drug,
    date: document.getElementById('ms_date').value,
    initWeight: parseFloat(document.getElementById('ms_initWeight').value) || null,
    curWeight,
    dose: document.getElementById('ms_dose').value.trim(),
    memo: document.getElementById('ms_memo').value.trim(),
  };
  if (!all[idx].measurements) all[idx].measurements = [];
  if (measureId) {
    const mi = all[idx].measurements.findIndex(x => x.id === measureId);
    if (mi >= 0) all[idx].measurements[mi] = { ...all[idx].measurements[mi], ...mData };
    toast('측정 수정되었습니다');
  } else {
    all[idx].measurements.push({ id: 'm' + nid++, ...mData });
    toast('측정 추가되었습니다');
  }
  persist(); closeSheet('measureSheet'); render();
};

/* ── 삭제 ── */
window.askDelPatient = id => {
  const p = all.find(x => x.id === id);
  document.getElementById('confirmTitle').textContent = '환자 삭제';
  document.getElementById('confirmMsg').textContent =
    `"${p?.name}" 환자와 모든 측정 기록을 삭제합니다.\n이 작업은 되돌리기 버튼으로 복구할 수 있습니다.`;
  confirmCb = () => {
    pushHistory();
    all = all.filter(x => x.id !== id);
    persist(); render(); toast('삭제되었습니다');
  };
  document.getElementById('confirmBackdrop').classList.add('open');
};
window.askDelMeasure = (patientId, measureId) => {
  document.getElementById('confirmTitle').textContent = '측정 기록 삭제';
  document.getElementById('confirmMsg').textContent = '이 측정 기록을 삭제합니다.';
  confirmCb = () => {
    pushHistory();
    const idx = all.findIndex(x => x.id === patientId);
    if (idx >= 0) all[idx].measurements = (all[idx].measurements||[]).filter(m => m.id !== measureId);
    persist(); render(); toast('삭제되었습니다');
  };
  document.getElementById('confirmBackdrop').classList.add('open');
};
window.closeConfirm = () => {
  document.getElementById('confirmBackdrop').classList.remove('open');
  confirmCb = null;
};
window.doConfirm = () => { if (confirmCb) confirmCb(); closeConfirm(); };

/* ── 시트 공통 ── */
window.closeSheet = id => document.getElementById(id).classList.remove('open');
window.onBackdropClick = (e, id) => {
  if (e.target === document.getElementById(id)) closeSheet(id);
};

function updateDate() {
  const d = new Date();
  document.getElementById('dateDisplay').textContent =
    `${d.getMonth()+1}/${d.getDate()} (${['일','월','화','수','목','금','토'][d.getDay()]})`;
}
updateDate();
